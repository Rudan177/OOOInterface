<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOOInterface 侧边栏</title>
    <!-- 复用主页面样式，保证与主页面视觉完全一致 -->
    <link rel="stylesheet" href="../Style/styles.css">
    <link rel="stylesheet" href="../Style/dynamic-blur.css">
    <link rel="stylesheet" href="../Style/widget-panel.css">
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
        rel="stylesheet">
    <link rel="stylesheet" href="sidepanel.css">
</head>

<body class="qa-panel-page">

    <!-- 壁纸层 -->
    <div class="qa-panel-wallpaper" id="qa-panel-wallpaper"></div>

    <!-- 面板内容区 -->
    <div class="qa-panel-content" id="qa-panel-content">

        <!-- 小组件（与主页面小组件面板同一套组件与配置）。
             内层 qa-panel-widgets-scroll 负责滚动：外层保留 10px 内边距，
             使滚动裁切始终发生在距底边 10px 处——下边距在任何滚动位置都恒定 -->
        <div class="qa-panel-widgets" id="qa-panel-widgets">
            <div class="qa-panel-widgets-scroll" id="qa-widgets-scroll">
                <div class="widget-panel-grid" id="qa-widgets-grid"></div>
            </div>
        </div>

        <!-- 快速访问链接侧边栏（结构与主页面 index.html 完全一致） -->
        <div id="quick-access-sidebar" class="quick-access-sidebar active">
            <div class="quick-access-sidebar-trigger" id="quick-access-sidebar-trigger"></div>
            <div class="quick-access-sidebar-container" id="quick-access-sidebar-container">
                <div class="quick-access-sidebar-links" id="quick-access-sidebar-links"></div>
                <div class="quick-access-sidebar-add" id="quick-access-sidebar-add">
                    <button class="quick-access-sidebar-add-btn" id="quick-access-sidebar-add-btn">
                        <span class="quick-access-sidebar-add-icon">+</span>
                        <span class="quick-access-sidebar-add-text">添加</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- 底部搜索区：搜索框 + 引擎切换按钮（复用主页面样式） -->
        <div class="qa-panel-search" id="qa-panel-search">
            <div class="search-section">
                <div class="search-container">
                    <div class="search-icon">
                        <svg focusable="false" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                            <path
                                d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z">
                            </path>
                        </svg>
                    </div>
                    <input type="text" id="qa-search-input" class="search-input">
                </div>
            </div>
            <div class="engine-buttons" id="qa-engine-buttons">
                <button id="qa-google-engine" class="engine-btn active">Google</button>
                <button id="qa-bing-engine" class="engine-btn">Bing</button>
            </div>
        </div>
    </div>

    <script src="../Script/color.js"></script>
    <script src="../Script/proxy.js"></script>
    <script src="../Script/widgets/WidgetBase.js"></script>
    <script src="../Script/widgets/ClockWidget.js"></script>
    <script src="../Script/widgets/CalendarWidget.js"></script>
    <script src="../Script/widgets/WeatherWidget.js"></script>
    <script src="../Script/widgets/TasksWidget.js"></script>
    <script src="../Script/widgets/AiAgentWidget.js"></script>
    <script src="../Script/widgets/EmailWidget.js"></script>
    <script src="../Script/widgets/UpgradeToolWidget.js"></script>
    <script src="sidepanel.js"></script>
</body>

</html>
