<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>主题商店 — </title>
<link rel="stylesheet" href="store.css">
<link rel="stylesheet" href="store-detail.css">
</head>
<body>

<div class="store-container">
  <header class="store-header">
    <div class="store-brand">OOOInterface</div>
    <h1 class="store-title">主题商店 BETA</h1>
    <p class="store-subtitle">主题商店临时版本 v0.1.0:01</p>
  </header>

  <div class="search-wrapper">
    <div class="search-box">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input class="search-input" id="searchInput" type="text" placeholder="搜索主题名称或设计师…" autocomplete="off">
      <svg class="search-clear" id="searchClear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </div>
  </div>

  <div class="result-count" id="resultCount"></div>
  <div class="theme-grid" id="themeGrid"></div>

  <div class="empty-state" id="emptyState">
    <svg class="empty-state-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
    <div class="empty-state-text">没有找到匹配的主题</div>
  </div>

  <footer class="store-footer"><p>OOOInterface 主题商店</p></footer>
</div>

<div class="detail-overlay" id="detailOverlay"></div>

<div class="detail-panel" id="detailPanel">
  <div class="detail-body">
    <div class="detail-col detail-col-left">
      <div class="detail-gallery-wrap">
        <div class="detail-hero">
          <img id="detailMainImg" src="" alt="">
        </div>
      </div>
      <div class="detail-thumbs" id="detailThumbs"></div>
    </div>
    <div class="detail-col detail-col-right">
      <button class="detail-close" id="detailClose" aria-label="关闭">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
      <div class="detail-right-content">
        <div class="detail-name" id="detailName"></div>
        <div class="detail-designer" id="detailDesigner"></div>
        <div class="detail-meta" id="detailMeta"></div>
        <div class="detail-desc" id="detailDesc"></div>
      </div>
      <div class="detail-actions" id="detailActions"></div>
    </div>
  </div>
</div>

<div class="source-overlay" id="sourceOverlay">
  <div class="source-panel">
    <div class="source-header">
      <div class="source-title">源代码</div>
      <div class="source-header-actions">
        <button class="source-copy" id="sourceCopy" aria-label="复制">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        </button>
        <button class="source-close" id="sourceClose" aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
    </div>
    <pre class="source-code" id="sourceCode"></pre>
  </div>
</div>

<script src="store.js"></script>
</body>
</html>
