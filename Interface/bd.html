<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>补丁下载引导</title>
</head>
<style>
    body {
        width: auto;
        background-image: url("../images/back.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
    }

    /* 深色模式壁纸压暗层 */
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0);
        pointer-events: none;
        transition: background-color 0.3s ease;
        z-index: -1;
    }

    @font-face {
        font-family: 'RUDAN';
        src: url('../font/RUDAN.otf');
    }

    @font-face {
        font-family: 'HMSC';
        src: url('../font/HarmonyOS_SansSC.ttf');
    }

    .WenBen {
        width: 80%; 
        margin-top: 25px; 
        margin-left: 50%; 
        margin-bottom: 50px;
        transform: translateX(-50%); 
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 20px;
        overflow: hidden;
        transition: background-color 0.3s ease;
    }

    h1 {
        padding: 12px 10px;
        margin: 0;
        text-align: center;
        font-size: 32px;
        font-weight: 800;
        color: #000;
        transition: color 0.3s ease;
    }

    hr {
        margin-top: 0;
        color: #11111130;
        border: none;
        height: 2px;
        background-color: #11111130;
        transition: background-color 0.3s ease;
    }

    h2 {
        font-family: 'HMSC';
        padding-left: 10%;
        width: 80%;
        font-size: 28px;
        font-weight: 800;
        color: #000;
        transition: color 0.3s ease;
    }

    .t {
        padding-left: 10%;
        width: 80%;
        margin-bottom: 50px;
    }

    p {
        margin-top: -20px;
        padding-bottom: 0px;
        font-size: 24px;
        font-weight: 500;
        color: #000;
        font-family: serif;
        text-indent: 2em;
        transition: color 0.3s ease;
    }

    ul,ol {
        padding-left: 10%;
        width: 80%;
    }

    li {
        margin-top: -20px;
        padding-bottom: 25px;
        font-size: 24px;
        font-weight: 500;
        color: #000;
        font-family: serif;
        transition: color 0.3s ease;
    }

    a {
        color: #00ae00;
        text-decoration: underline;
        font-weight: 100;
        transition: all 0.1s ease-in-out;
    }

    a:hover {
        color: #10bf90;
        font-weight: 800;
        font-size: 1.5em;
    }

    /* ===== 版本支持状态表格 ===== */
    .version-card {
        width: 80%;
        margin-top: 25px;
        margin-left: 50%;
        margin-bottom: 50px;
        transform: translateX(-50%);
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 20px;
        overflow: hidden;
        transition: background-color 0.3s ease;
    }


    @media (prefers-color-scheme: dark) {
        .version-card {
            background-color: rgba(20, 20, 30, 0.5);
        }
    }

    @media (max-width: 768px) {
        .version-card {
            width: 92%;
            margin-bottom: 30px;
        }
    }

    .version-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 18px;
        font-family: serif;
        color: #000;
        transition: color 0.3s ease;
    }

    .version-table th {
        text-align: left;
        padding: 10px 16px;
        font-weight: 700;
        font-size: 17px;
        border-bottom: 2px solid rgba(0, 0, 0, 0.15);
        color: #000;
        transition: color 0.3s ease, border-color 0.3s ease;
    }

    .version-table td {
        padding: 10px 16px;
        border-bottom: 1px solid rgba(0, 0, 0, 0.08);
        color: #000;
        transition: color 0.3s ease;
    }

    .version-table tr:hover td {
        background-color: rgba(0, 174, 0, 0.06);
    }

    .version-table .status-stopped {
        color: #888;
    }

    .version-table .status-soon {
        color: #e6a800;
        font-weight: 600;
    }

    .version-table .status-active {
        color: #00ae00;
        font-weight: 600;
    }

    .version-divider {
        width: 100%;
        margin-top: 0;
        border: none;
        height: 2px;
        background-color: #11111130;
        transition: background-color 0.3s ease;
    }

    @media (prefers-color-scheme: dark) {
        .version-divider {
            background-color: #ffffff30;
        }
    }

    .support-btn {
        display: flex;
        align-items: center;
        gap: 6px;
        justify-content: flex-end;
        margin-top: 8px;
        margin-bottom: 4px;
        padding-right: 20px;
        cursor: pointer;
        font-size: 14px;
        font-family: 'HMSC', serif;
        font-weight: 600;
        color: #000;
        user-select: none;
        transition: color 0.2s ease;
    }

    @media (prefers-color-scheme: dark) {
        .support-btn {
            color: #e0e0e0;
        }
    }

    .support-btn input[type="checkbox"] {
        appearance: none;
        -webkit-appearance: none;
        width: 16px;
        height: 16px;
        border: 2px solid #00ae00;
        border-radius: 4px;
        background: transparent;
        cursor: pointer;
        flex-shrink: 0;
        position: relative;
        transition: background-color 0.15s ease, border-color 0.15s ease;
    }

    .support-btn input[type="checkbox"]:checked {
        background-color: #00ae00;
        border-color: #00ae00;
    }

    .support-btn input[type="checkbox"]:checked::after {
        content: '';
        position: absolute;
        left: 4px;
        top: 1px;
        width: 4px;
        height: 8px;
        border: solid #fff;
        border-width: 0 2px 2px 0;
        transform: rotate(45deg);
    }

    /* 小屏幕适配 */
    @media (max-width: 768px) {
        .support-btn {
            font-size: 13px;
        }
    }

    /* 深色模式表格适配 */
    @media (prefers-color-scheme: dark) {
        .version-table {
            color: #e0e0e0;
        }

        .version-table th {
            border-bottom-color: rgba(255, 255, 255, 0.15);
            color: #e0e0e0;
        }

        .version-table td {
            color: #e8e8e8;
            border-bottom-color: rgba(255, 255, 255, 0.07);
        }

        .version-table tr:hover td {
            background-color: rgba(0, 174, 0, 0.12);
        }

        .version-table .status-stopped {
            color: #aaa;
        }

        .version-table .status-soon {
            color: #f0c040;
        }

        .version-table .status-active {
            color: #00c853;
        }
    }

    /* 小屏幕表格适配 */
    @media (max-width: 768px) {
        .version-table {
            font-size: 14px;
        }

        .version-table th,
        .version-table td {
            padding: 8px 10px;
        }

        .version-table th:nth-child(1),
        .version-table td:nth-child(1) { width: 40%; }

        .version-table th:nth-child(2),
        .version-table td:nth-child(2) { width: 40%; }

        .version-table th:nth-child(3),
        .version-table td:nth-child(3) { width: 20%; text-align: right; }
    }

    /* ===== 深色模式 ===== */
    @media (prefers-color-scheme: dark) {
        body::after {
            background-color: rgba(0, 0, 0, 0.55);
        }

        .WenBen {
            background-color: rgba(20, 20, 30, 0.5);
        }

        h1, h2, p, li {
            color: #e0e0e0;
        }

        hr {
            background-color: #ffffff30;
        }

        a {
            color: #00ae00;
        }

        a:hover {
            color: #10bf90;
        }
    }

    /* ===== 小屏幕适配 ===== */
    @media (max-width: 768px) {
        .WenBen {
            width: 92%;
            margin-top: 15px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            margin: 0;
            padding: 8px 8px;
        }

        hr {
            margin-top: 0;
        }

        h2 {
            font-size: 20px;
            padding-left: 6%;
            width: 88%;
        }

        ul, ol, .t {
            padding-left: 6%;
            width: 88%;
            margin-bottom: 15px;
        }

        li, p {
            font-size: 17px;
            margin-top: -18px;
            margin-bottom: 15px;
            padding-bottom: 9px;
        }
    }

   </style>
<body>
    <div class="WenBen">
        <h1><span style="font-family: 'RUDAN';">OOOInterface</span></span>&nbsp;<span style="font-family: serif;">补丁下载引导</span></h1>
        <hr>
        <h2>重要通知</h2>
        <div class="t">
            <p>OOOInterface LTS 5.3 即将发布。该版本修复了大量已知问题，重构底层代码，大幅提升用户实际使用体验。</p>
            <p>但因底层升级，为保证用户数据安全，OOOInterface 将推出过渡版本。过渡版本包含了确保更新时用户数据安全的补丁，建议所有用户进行更新。</p>
        </div>
        <hr>
        <h2>前往下载页</h2>
        <ul>
            <li><a href="30/5.3.html" target="5.2">OOOInterface LTS 5.2 </a></li>
            <li><a href="29/29.html" target="29">OOOInterface 29 </a></li>
        </ul>
    </div>
    <div class="version-card">
            <h1>版本支持状态</h1>
            <hr class="version-divider">
            <label class="support-btn" id="supportLabel"><input type="checkbox" id="supportCheck"> 仅显示支持版本</label>
        <table class="version-table" id="versionTable">
                <thead>
                    <tr>
                        <th>版本</th>
                        <th>状态</th>
                        <th>天数</th>
                    </tr>
                </thead>
                <tbody id="versionBody">
                </tbody>
            </table>
        </div>
    <script type="application/json" id="versionData">
[
  {"version":"OOOInterface 1.0 ~ 1.4","status":"停止支持","days":"--天","supported":false},
  {"version":"OOOInterface 2.0 ~ 2.9","status":"停止支持","days":"--天","supported":false},
  {"version":"OOOInterface 3.0 ~ 3.5","status":"停止支持","days":"--天","supported":false},
  {"version":"OOOInterface 4.0","status":"已于2026.10.10停止支持","days":"45天","supported":false},
  {"version":"OOOInterface 5.0","status":"已于2026.3.2停止支持","days":"60天","supported":false},
  {"version":"OOOInterface 5.1","status":"已于2026.6.18停止支持","days":"128天","supported":false},
  {"version":"OOOInterface 5.2","status":"即将于2026.10.24停止支持","days":"128天","supported":true},
  {"version":"OOOInterface 26","status":"已于2026.7.10停止支持","days":"7天","supported":false},
  {"version":"OOOInterface 27","status":"已于2026.7.17停止支持","days":"7天","supported":false},
  {"version":"OOOInterface 28","status":"已于2026.8.1停止支持","days":"15天","supported":false},
  {"version":"OOOInterface 29","status":"已于2026.8.9停止支持","days":"8天","supported":false},
  {"version":"OOOInterface LTS 5.3","status":"于2026.12.15停止支持","days":"128天","supported":true}
]
    </script>
    <script>
        const data = JSON.parse(document.getElementById('versionData').textContent);
        const tbody = document.getElementById('versionBody');

        function renderTable() {
            const filter = document.getElementById('supportCheck').checked;
            tbody.innerHTML = '';
            data.forEach(item => {
                if (filter && !item.supported) return;
                const tr = document.createElement('tr');
                const statusClass = !item.supported ? 'status-stopped'
                    : item.status.startsWith('即将') ? 'status-soon'
                    : 'status-active';
                tr.innerHTML = `<td>${item.version}</td><td class="${statusClass}">${item.status}</td><td>${item.days}</td>`;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('supportCheck').addEventListener('change', renderTable);
        renderTable();
    </script>
</body>
<footer style="text-align: center;font-size: 18px; margin-bottom: 30px; ;">
    <a href="../index.html" style="margin-right: 10px;">返回首页</a>
</footer>
</html>
