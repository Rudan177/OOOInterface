<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>补丁下载引导</title>

<style>
    body {
        width: auto;
        background-image: url("../images/back.png");
        background-repeat: no-repeat;
        background-size: cover;
        background-attachment: fixed;
        background-position: center;
    }

    /* 深色模式壁纸压暗层 */
    body::after {
        content: '';
        position: fixed;
        inset: 0;
        background-color: rgba(0, 0, 0, 0);
        pointer-events: none;
        transition: background-color 0.3s ease;
        z-index: -1;
    }

    @font-face {
        font-family: 'RUDAN';
        src: url('../font/RUDAN.otf');
    }

    @font-face {
        font-family: 'HMSC';
        src: url('../font/HarmonyOS_SansSC.ttf');
    }

    .WenBen {
        width: 80%; 
        margin-top: 25px; 
        margin-left: 50%; 
        margin-bottom: 50px;
        transform: translateX(-50%); 
        backdrop-filter: blur(25px);
        -webkit-backdrop-filter: blur(25px);
        border-radius: 20px;
        transition: background-color 0.3s ease;
    }

    h1 {
        padding: 25px 10px;
        text-align: center;
        font-size: 32px;
        font-weight: 800;
        color: #000;
        transition: color 0.3s ease;
    }

    hr {
        margin-top: -30px;
        color: #11111130;
        border: none;
        height: 2px;
        background-color: #11111130;
        transition: background-color 0.3s ease;
    }

    h2 {
        font-family: 'HMSC';
        padding-left: 10%;
        width: 80%;
        font-size: 28px;
        font-weight: 800;
        color: #000;
        transition: color 0.3s ease;
    }

    .t {
        padding-left: 10%;
        width: 80%;
        margin-bottom: 50px;
    }

    p {
        margin-top: -20px;
        padding-bottom: 0px;
        font-size: 24px;
        font-weight: 500;
        color: #000;
        font-family: serif;
        text-indent: 2em;
        transition: color 0.3s ease;
    }

    ul,ol {
        padding-left: 10%;
        width: 80%;
    }

    li {
        margin-top: -20px;
        padding-bottom: 25px;
        font-size: 24px;
        font-weight: 500;
        color: #000;
        font-family: serif;
        transition: color 0.3s ease;
    }

    a {
        color: #00ae00;
        text-decoration: underline;
        font-weight: 100;
        transition: all 0.1s ease-in-out;
    }

    a:hover {
        color: #10bf90;
        font-weight: 800;
        font-size: 1.5em;
    }

    /* ===== 深色模式 ===== */
    @media (prefers-color-scheme: dark) {
        body::after {
            background-color: rgba(0, 0, 0, 0.55);
        }

        .WenBen {
            background-color: rgba(20, 20, 30, 0.5);
        }

        h1, h2, p, li {
            color: #e0e0e0;
        }

        hr {
            background-color: #ffffff30;
        }

        a {
            color: #00ae00;
        }

        a:hover {
            color: #10bf90;
        }
    }

    /* ===== 小屏幕适配 ===== */
    @media (max-width: 768px) {
        .WenBen {
            width: 92%;
            margin-top: 15px;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 24px;
            padding: 18px 8px;
        }

        hr {
            margin-top: -22px;
        }

        h2 {
            font-size: 20px;
            padding-left: 6%;
            width: 88%;
        }

        ul, ol, .t {
            padding-left: 6%;
            width: 88%;
            margin-bottom: 15px;
        }

        li, p {
            font-size: 17px;
            margin-top: -18px;
            margin-bottom: 15px;
            padding-bottom: 9px;
        }
    }

   </style>
